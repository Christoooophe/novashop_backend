name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - name: Audit (blocking on prod high)
        run: npm audit --omit=dev --audit-level=high
      - name: Generate JSON report
        if: always()
        run: npm audit --omit=dev --json > audit-report.json
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: audit-report.json
      - name: Summary in run
        if: always()
        run: npm audit --omit=dev | tee -a "$GITHUB_STEP_SUMMARY"

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t novashop-backend:ci .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novashop-backend:ci
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
