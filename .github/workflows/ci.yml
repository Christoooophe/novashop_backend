name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - name: Audit (blocking on prod high)
        run: npm audit --omit=dev --audit-level=high
      - name: Generate JSON report
        if: always()
        run: npm audit --omit=dev --json > audit-report.json
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: audit-report.json
      - name: Summary in run
        if: always()
        run: npm audit --omit=dev | tee -a "$GITHUB_STEP_SUMMARY"

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t novashop-backend:ci .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novashop-backend:ci
          format: table
          severity: CRITICAL
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-staging:
    needs:
      - test
      - sca
      - trivy
      - gitleaks
      - sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t ghcr.io/christoooophe/novashop_backend:${{ github.sha }} .
          docker push ghcr.io/christoooophe/novashop_backend:${{ github.sha }}
      - name: Update staging tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/christoooophe/novashop_backend:${{ github.sha }} ghcr.io/christoooophe/novashop_backend:staging
          docker push ghcr.io/christoooophe/novashop_backend:staging
      - run: echo "deploy staging ok"

  smoke:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novashop
          POSTGRES_PASSWORD: novashop
          POSTGRES_DB: novashop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novashop -d novashop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - name: Start app
        env:
          PORT: 5000
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: novashop
          PGPASSWORD: novashop
          PGDATABASE: novashop
        run: |
          npm run build
          nohup npm run start:prod > smoke-app.log 2>&1 &
      - name: Smoke test staging
        env:
          BASE_URL: http://localhost:5000
        run: bash scripts/smoke.sh
      - name: App logs
        if: always()
        run: cat smoke-app.log

  deploy-prod:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy prod ok"
